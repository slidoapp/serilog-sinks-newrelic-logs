name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # A manual run tests the whole pipeline and publishes a preview package, whose
  # version is the project version with a -preview-<run number> suffix.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  ContinuousIntegrationBuild: true
  Configuration: Release
  PackageId: Slido.Serilog.Sinks.NewRelic.Logs
  PackageProject: src/Serilog.Sinks.NewRelic.Logs/Serilog.Sinks.NewRelic.Logs.csproj
  TestProject: tests/Serilog.Sinks.NewRelic.Logs.Tests/Serilog.Sinks.NewRelic.Logs.Tests.csproj

jobs:
  release:
    runs-on: windows-2025-vs2026

    environment:
      name: production
      url: https://www.nuget.org/packages/Slido.Serilog.Sinks.NewRelic.Logs

    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: resolve package version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          project_version="$(dotnet msbuild "${{ env.PackageProject }}" -getProperty:Version | tr -d '\r')"
          version="${project_version}-preview-${GITHUB_RUN_NUMBER}"
        fi

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "'${GITHUB_REF_NAME}' does not resolve to a valid NuGet package version: '${version}'." >&2
          exit 1
        fi

        echo "Package version: $version"

        echo "package_version=$version" >> "$GITHUB_OUTPUT"

    - name: restore
      run: |
        dotnet restore "${{ env.PackageProject }}"
        dotnet restore "${{ env.TestProject }}"

    # The tests are built with the same properties, so they test the library that gets
    # published. Every build copies the library DLLs from obj to bin again, so signing
    # must run after the last build and pack must use --no-build.
    - name: build
      run: >
        dotnet build "${{ env.PackageProject }}"
        --no-restore
        -c "${{ env.Configuration }}"
        -p:PackageId="${{ env.PackageId }}"
        -p:PackageVersion="${{ steps.version.outputs.package_version }}"
        -p:Version="${{ steps.version.outputs.package_version }}"

    - name: build tests
      run: >
        dotnet build "${{ env.TestProject }}"
        --no-restore
        -c "${{ env.Configuration }}"
        -p:PackageId="${{ env.PackageId }}"
        -p:PackageVersion="${{ steps.version.outputs.package_version }}"
        -p:Version="${{ steps.version.outputs.package_version }}"

    - name: test
      run: dotnet test --project "${{ env.TestProject }}" --no-build -c "${{ env.Configuration }}"

    # The azure/login action isn't on this repository's list of allowed actions, so the
    # Azure CLI signs in with the job's OIDC token directly. AzureSignTool picks up the
    # Azure CLI session the same way it does after azure/login in powerpoint-win.
    # The repository is public, so the signing settings are stored as secrets, which
    # GitHub masks in the logs.
    - name: azure login
      shell: pwsh
      env:
        KEYVAULT_CLIENT_ID: ${{ secrets.KEYVAULT_CLIENT_ID }}
        KEYVAULT_TENANT_ID: ${{ secrets.KEYVAULT_TENANT_ID }}
        KEYVAULT_URL: ${{ secrets.KEYVAULT_URL }}
        SIGNING_CERTIFICATE_NAME: ${{ secrets.SIGNING_CERTIFICATE_NAME }}
      run: |
        foreach ($name in 'KEYVAULT_CLIENT_ID', 'KEYVAULT_TENANT_ID', 'KEYVAULT_URL', 'SIGNING_CERTIFICATE_NAME') {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            Write-Error "The repository secret '$name' is not set."
            exit 1
          }
        }

        $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange"
        $headers = @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
        $token = (Invoke-RestMethod -Uri $tokenUrl -Headers $headers).value
        Write-Output "::add-mask::$token"

        az login --service-principal `
          --username $env:KEYVAULT_CLIENT_ID `
          --tenant $env:KEYVAULT_TENANT_ID `
          --federated-token $token `
          --allow-no-subscriptions `
          --output none
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: cache AzureSignTool
      uses: actions/cache@v6
      id: cache-azuresigntool
      with:
        path: ~/.dotnet/tools
        key: azuresigntool-7.0.1

    - name: install AzureSignTool
      if: steps.cache-azuresigntool.outputs.cache-hit != 'true'
      run: dotnet tool install --verbosity minimal --global azuresigntool --version 7.0.1

    # Only the DLLs are signed. The NuGet package itself stays unsigned.
    - name: sign
      shell: pwsh
      env:
        KEYVAULT_URL: ${{ secrets.KEYVAULT_URL }}
        SIGNING_CERTIFICATE_NAME: ${{ secrets.SIGNING_CERTIFICATE_NAME }}
      run: |
        $dlls = Get-ChildItem "src/Serilog.Sinks.NewRelic.Logs/bin/${{ env.Configuration }}/*/Serilog.Sinks.NewRelic.Logs.dll"
        if ($dlls.Count -eq 0) {
          Write-Error "No library DLLs were found to sign."
          exit 1
        }

        AzureSignTool.exe sign -du "https://slido.com" `
          -kvu $env:KEYVAULT_URL `
          -kvm `
          -kvc $env:SIGNING_CERTIFICATE_NAME `
          -tr http://timestamp.digicert.com `
          -v `
          $dlls.FullName
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: pack
      run: >
        dotnet pack "${{ env.PackageProject }}"
        --no-build
        --no-restore
        -c "${{ env.Configuration }}"
        -o "${{ github.workspace }}/dist"
        -p:PackageId="${{ env.PackageId }}"
        -p:PackageVersion="${{ steps.version.outputs.package_version }}"
        -p:Version="${{ steps.version.outputs.package_version }}"

    - name: verify signatures
      shell: pwsh
      run: |
        $extracted = Join-Path $env:RUNNER_TEMP "package"
        $package = Get-ChildItem "${{ github.workspace }}/dist/*.nupkg" | Select-Object -First 1
        Expand-Archive -Path $package.FullName -DestinationPath $extracted -Force

        $dlls = Get-ChildItem -Path (Join-Path $extracted "lib") -Recurse -Filter "*.dll"
        if ($dlls.Count -eq 0) {
          Write-Error "The package $($package.Name) contains no DLLs."
          exit 1
        }

        $failed = $false
        foreach ($dll in $dlls) {
          $signature = Get-AuthenticodeSignature $dll.FullName
          Write-Output "$($dll.Directory.Name)/$($dll.Name): $($signature.Status) $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { $failed = $true }
        }

        if ($failed) {
          Write-Error "The package $($package.Name) contains DLLs without a valid signature."
          exit 1
        }

    - name: publish artifact
      uses: actions/upload-artifact@v7
      with:
        name: Slido.Serilog.Sinks.NewRelic.Logs_packages
        path: ${{ github.workspace }}/dist/*.nupkg

    - name: authenticate nuget.org
      uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nuget
      with:
        user: ${{ secrets.NUGET_PUSH_USER }}

    - name: publish
      working-directory: ${{ github.workspace }}/dist
      run: dotnet nuget push "*.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
